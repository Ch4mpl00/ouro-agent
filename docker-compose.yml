# Native MCP/agent services are managed by deploy/systemd/*.service.
# This compose project keeps only the database and tunnel daemon.
# Keep its project name/directory stable: the existing data volume is
# agent-helper_pg-data.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp}
      POSTGRES_DB: ${POSTGRES_DB:-mcp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.12
    env_file: .env.mcp
    # The restricted native MCP listens on host loopback, not a public port.
    network_mode: host
    environment:
      MCP_SERVER_URL: http://127.0.0.1:3001/mcp
      LOG_LEVEL: info
      LOG_FORMAT: json
    entrypoint:
      - /bin/sh
      - -c
      - |
        export CONTROL_PLANE_TUNNEL_ID="$${OPENAI_TUNNEL_ID:?set OPENAI_TUNNEL_ID in .env.mcp}"
        exec /usr/bin/tunnel-client run --control-plane.api-key=env:OPENAI_TUNNEL_API_KEY
    # systemd owns retries and waits for the native MCP endpoint first.
    restart: "no"

volumes:
  pg-data:
