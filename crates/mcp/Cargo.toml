[package]
name = "mcp-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "4.0.1"
deadpool-postgres = "0.14.2"
dom_smoothie = "0.18.2"
dotenvy = "0.15.7"
feed-rs = "3.0.0"
futures = "0.3.34"
grammers-client = "0.10.0"
hex = "0.4.3"
pdf-extract = "0.12.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip", "charset", "http2", "form", "query"] }
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
# The agent's skill loader and MCP client, for the cross-crate contract tests
# (tests/skills_contract.rs, tests/shipped_skills.rs).
agent = { path = "../agent" }
# The engine the agent's test support names (tests/skill_index_workflow.rs
# includes crates/agent/tests/support), at the agent's tag.
ouro-runtime = { git = "https://github.com/Ch4mpl00/ouro", tag = "v0.4.0" }
cucumber = "0.23"
proptest = "1"
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# The same crate testcontainers-modules re-exports; only adds the feature that
# lets every test process share one container (tests/support/container.rs).
testcontainers = { version = "0.27", features = ["reusable-containers"] }

# The executable specification: specs/*.feature, run against the real server.
#   cargo test --test specs
[[test]]
name = "specs"
harness = false

# The reference model of memory documents (tests/model/model.rs) and the
# real server against it: random call sequences, then concurrent histories
# checked for linearizability.
#   cargo test --test model
[[test]]
name = "model"
path = "tests/model/main.rs"
