[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
croner = "4.0.1"
dotenvy = "0.15.7"
futures = "0.3.34"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "http2"] }
rmcp = { version = "3.5", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
hex = "0.4.3"
owf = { path = "../owf" }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["server", "transport-streamable-http-server"] }
axum = "0.8.9"
proptest = "1"
tempfile = "3"
tokio = { version = "1.53.1", features = ["full", "test-util"] }

[[bin]]
name = "agent-supervisor"
path = "src/main.rs"
