document: { dsl: '1.0.4', namespace: agent, name: guard, version: '1.0.0', metadata: { ouro: { breaker: 'off' } } }
# A loop's round review, a host child of the loop (design 03): only its
# host-owned review evidence and consumed button events authorize a call.
# A card whose send outcome is unknown is never sent again: its call
# resolves unverified and the round's other verdicts stand.
# Built-ins never trip (design 01, decision 10): a provider outage must not stop the agent.
do:
  - review:
      call: review
      export: { as: '${ . }' }
  - calls:
      for: { each: item, in: '${ $context.items }' }
      metadata: { ouro: { concurrency: 16 } }
      do:
        - route:
            switch:
              - ask: { when: '${ $context.confirmable and $item.label == "needs_confirmation" }', then: confirm }
              - ordinary: { then: resolve }
        - confirm:
            try:
              - request:
                  call: confirm_request
                  with: { call: '${ $item.call }' }
                  export: { as: '${ $context + { request: . } }' }
            catch:
              errors: { with: { type: urn:ouro:errors:call.unknown } }
              do:
                - unknown_card:
                    set: '${ "unverified" }'
                    export: { as: '${ $context + { request: null, outcome: "unverified" } }' }
        - answer:
            if: '${ $context.request != null }'
            try:
              - listen:
                  listen:
                    to:
                      any:
                        - with: { type: '${ $context.request.types[0] }' }
                        - with: { type: '${ $context.request.types[1] }' }
                  metadata: { ouro: { hold: PT5S } }
                  timeout: { after: PT24H }
              - outcome:
                  set: '${ if .[0].type == $context.request.types[0] then "confirmed" else "declined" end }'
            catch:
              errors: { with: { status: 408 } }
              do:
                - expired: { set: '${ "expired" }' }
            export: { as: '${ $context + { outcome: . } }' }
        - resolve:
            call: resolve_review
            with: { call: '${ $item.call }', outcome: '${ $context.outcome // null }' }
output:
  as: '${ { verdicts: . } }'
