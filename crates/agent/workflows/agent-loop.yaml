document: { dsl: '1.0.4', namespace: agent, name: agent-loop, version: '1.0.0', metadata: { loop: { description: 'General ReAct loop with guarded tools and workers.' }, ouro: { breaker: 'off' } } }
# The ReAct loop as a durable engine run. The host admits it with the model's
# parameters as host data; its input carries the transcript (`messages`) and
# the working memory, its context the turn count; every task record is a
# checkpoint, so a restart resumes the loop where it was. A workflow starts
# it with `start_child { host: inherit, input: { request } }` (design 09):
# then its input is its request, and `begin` takes the transcript and the
# working memory the host prepared from it.
# Built-ins never trip (design 01, decision 10): a provider outage must not stop the agent.
input:
  from: '${ . + { i: 0 } }'
do:
  - begin:
      if: '${ $context.messages == null }'
      call: loop_begin
      export: { as: '${ $context + . }' }
  - turn:
      call: agent_turn
      with: { messages: '${ $context.messages }', memory: '${ $context.memory }', i: '${ $context.i }' }
      export: { as: '${ $context + { messages: ($context.messages + [ .message ]), calls: .calls, i: ($context.i + 1) } }' }
  - route:
      switch:
        - answered: { when: '${ .calls == [] }', then: answer }
        - act: { then: observe }
  - observe:
      # A loop started with an observer (`on_step`, host data) tells it what
      # this turn decided, before the calls run; never joined, and a broken
      # observer is ignored (`observe_step`). Rounds of only bookkeeping skip it.
      if: '${ $context.on_step != null and ([ $context.calls[] | select(.name != "finish" and (.name | startswith("working_memory_") | not)) ] | length) > 0 }'
      call: observe_step
      with: { i: '${ $context.i }', calls: '${ $context.calls }', content: '${ .content }', reasoning: '${ .message.reasoning_content // null }' }
  - guard:
      call: start_guard
      with: { calls: '${ $context.calls }', i: '${ $context.i }' }
      export: { as: '${ $context + { guard_run: .run, guarded: (.guarded // []) } }' }
  - round:
      # Independent calls keep progressing while the guard waits for a press.
      fork:
        branches:
          - ready:
              for: { each: entry, in: '${ $context.calls | to_entries | map(select(.key as $k | ($context.guarded // [] | index($k)) == null)) }' }
              metadata: { ouro: { concurrency: 16 } }
              do:
                - start_worker:
                    if: '${ $entry.value.name == "invoke_sub_agent" }'
                    call: start_worker
                    with: { call: '${ $entry.value }', i: '${ $context.i }', index: '${ $entry.key }', memory: '${ $context.memory }' }
                    export: { as: '${ $context + { worker: .id } }' }
                - start_reflex:
                    # A reflex (design 10) the round need not review: a
                    # closed-world read, or a call that starts nothing.
                    if: '${ $entry.value.name == "run_reflex" }'
                    call: start_reflex
                    with: { call: '${ $entry.value }', guard_run: null, i: '${ $context.i }', index: '${ $entry.key }' }
                    export: { as: '${ $context + { reflex: .id, reflex_error: (.error // null) } }' }
                - wait_worker:
                    if: '${ $context.worker != null }'
                    listen:
                      read: envelope
                      to:
                        any:
                          - with: { type: '${ "done:" + $context.worker }' }
                          - with: { type: '${ "waiting:" + $context.worker }' }
                    metadata: { ouro: { hold: PT15M } }
                - sleep_worker:
                    if: '${ $context.worker != null and .[0].type == ("waiting:" + $context.worker) }'
                    listen: { to: { one: { with: { type: '${ "done:" + $context.worker }' } } } }
                - wait_reflex:
                    if: '${ $context.reflex != null }'
                    listen:
                      read: envelope
                      to:
                        any:
                          - with: { type: '${ "done:" + $context.reflex }' }
                          - with: { type: '${ "waiting:" + $context.reflex }' }
                    metadata: { ouro: { hold: PT15M } }
                - sleep_reflex:
                    if: '${ $context.reflex != null and .[0].type == ("waiting:" + $context.reflex) }'
                    listen: { to: { one: { with: { type: '${ "done:" + $context.reflex }' } } } }
                - classify:
                    call: classify
                    with: { call: '${ $entry.value }', guard_run: null, worker_run: '${ $context.worker // null }', reflex_run: '${ $context.reflex // null }', i: '${ $context.i }', index: '${ $entry.key }' }
                    export: { as: '${ $context + { once: .once } }' }
                - once:
                    if: '${ $context.once }'
                    try:
                      - send:
                          call: tool_once
                          with: { call: '${ $entry.value }', guard_run: null, i: '${ $context.i }', index: '${ $entry.key }', memory: '${ if ($entry.value.name | startswith("working_memory_")) then $context.memory else null end }' }
                    catch:
                      errors: { with: { type: urn:ouro:errors:call.unknown } }
                      do:
                        - unknown:
                            set: '${ { presented: ("[tool error] outcome unknown: " + $entry.value.name + " was sent before a restart and its reply was lost, so it may or may not have run. Check its effect before repeating it."), failed: true } }'
                - repeat:
                    if: '${ $context.once | not }'
                    call: tool_repeat
                    with:
                      call: '${ $entry.value }'
                      guard_run: null
                      worker_run: '${ $context.worker // null }'
                      reflex_run: '${ $context.reflex // null }'
                      reflex_error: '${ $context.reflex_error // null }'
                      i: '${ $context.i }'
                      index: '${ $entry.key }'
                      memory: '${ if ($entry.value.name | startswith("working_memory_")) or $entry.value.name == "invoke_sub_agent" then $context.memory else null end }'
                - indexed:
                    set: '${ { index: $entry.key, result: . } }'
          - held:
              do:
                - wait_guard:
                    if: '${ $context.guard_run != null }'
                    listen:
                      read: envelope
                      to:
                        any:
                          - with: { type: '${ "done:" + $context.guard_run }' }
                          - with: { type: '${ "waiting:" + $context.guard_run }' }
                    metadata: { ouro: { hold: PT60S } }
                - sleep_guard:
                    if: '${ $context.guard_run != null and .[0].type == ("waiting:" + $context.guard_run) }'
                    listen: { to: { one: { with: { type: '${ "done:" + $context.guard_run }' } } } }
                - calls:
                    for: { each: entry, in: '${ $context.calls | to_entries | map(select(.key as $k | ($context.guarded // [] | index($k)) != null)) }' }
                    metadata: { ouro: { concurrency: 16 } }
                    do:
                      - start_reflex:
                          # A reviewed reflex (design 10) starts under its
                          # verdict, which this start spends; the join only
                          # checks it.
                          if: '${ $entry.value.name == "run_reflex" }'
                          call: start_reflex
                          with: { call: '${ $entry.value }', guard_run: '${ $context.guard_run // null }', i: '${ $context.i }', index: '${ $entry.key }' }
                          export: { as: '${ $context + { reflex: .id, reflex_error: (.error // null) } }' }
                      - wait_reflex:
                          if: '${ $context.reflex != null }'
                          listen:
                            read: envelope
                            to:
                              any:
                                - with: { type: '${ "done:" + $context.reflex }' }
                                - with: { type: '${ "waiting:" + $context.reflex }' }
                          metadata: { ouro: { hold: PT15M } }
                      - sleep_reflex:
                          if: '${ $context.reflex != null and .[0].type == ("waiting:" + $context.reflex) }'
                          listen: { to: { one: { with: { type: '${ "done:" + $context.reflex }' } } } }
                      - classify:
                          call: classify
                          with: { call: '${ $entry.value }', guard_run: '${ $context.guard_run // null }', worker_run: null, reflex_run: '${ $context.reflex // null }', i: '${ $context.i }', index: '${ $entry.key }' }
                          export: { as: '${ $context + { once: .once } }' }
                      - once:
                          if: '${ $context.once }'
                          try:
                            - send:
                                call: tool_once
                                with: { call: '${ $entry.value }', guard_run: '${ $context.guard_run // null }', i: '${ $context.i }', index: '${ $entry.key }' }
                          catch:
                            errors: { with: { type: urn:ouro:errors:call.unknown } }
                            do:
                              - unknown:
                                  set: '${ { presented: ("[tool error] outcome unknown: " + $entry.value.name + " was sent before a restart and its reply was lost, so it may or may not have run. Check its effect before repeating it."), failed: true } }'
                      - repeat:
                          if: '${ $context.once | not }'
                          call: tool_repeat
                          with: { call: '${ $entry.value }', guard_run: '${ $context.guard_run // null }', reflex_run: '${ $context.reflex // null }', reflex_error: '${ $context.reflex_error // null }', i: '${ $context.i }', index: '${ $entry.key }' }
                      - indexed:
                          set: '${ { index: $entry.key, result: . } }'
      output: { as: '${ (.[0] + .[1]) | sort_by(.index) | map(.result) }' }
  - settle:
      call: agent_settle
      with: { calls: '${ $context.calls }', results: '${ . }', memory: '${ $context.memory }' }
      export: { as: '${ $context + { messages: ($context.messages + .replies), memory: .memory } }' }
  - next:
      switch:
        - finished: { when: '${ .finished }', then: end }
        - more: { then: turn }
  - answer:
      set: '${ { output: .content } }'
output:
  as: '${ .output }'
