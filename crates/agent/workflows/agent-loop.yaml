document: { dsl: '1.0.4', namespace: agent, name: agent-loop, version: '1.0.0' }
# The ReAct loop as a durable workflow. The context carries the loop's spec,
# its transcript (`messages`), its working memory and the turn count; every
# task record is a checkpoint, so a restart resumes the loop where it was.
input:
  from: '${ . + { i: 0 } }'
do:
  - turn:
      call: agent_turn
      with: { loop: '${ $context.loop }', messages: '${ $context.messages }', memory: '${ $context.memory }', i: '${ $context.i }' }
      export: { as: '${ $context + { messages: ($context.messages + [ .message ]), calls: .calls, i: ($context.i + 1) } }' }
  - route:
      switch:
        - answered: { when: '${ .calls == [] }', then: answer }
        - act: { then: guard }
  - guard:
      call: guard
      with: { loop: '${ $context.loop }', calls: '${ $context.calls }' }
      export: { as: '${ $context + { guarded: . } }' }
  - round:
      for: { each: call, in: '${ $context.calls }' }
      # The loop's own limit (max_concurrent_tools) applies inside `tool`.
      metadata: { concurrency: 16 }
      do:
        # Host-rendered cards bind approval to the exact held call. Workers
        # and runs without a durable confirmation target keep blocking.
        - route_confirmation:
            switch:
              - ask: { when: '${ $context.guarded.confirmable and $context.guarded.labels[$call.id] == "needs_confirmation" }', then: confirm }
              - ordinary: { then: one }
        - confirm:
            call: confirm_request
            with: { loop: '${ $context.loop }', call: '${ $call }' }
            export: { as: '${ $context + { confirmation_request: . } }' }
        - needs_answer:
            switch:
              - waiting: { when: '${ .required == true }', then: answer_confirmation }
              - reviewed: { then: one }
        - answer_confirmation:
            try:
              - listen:
                  listen:
                    to:
                      any:
                        - with: { type: '${ $context.confirmation_request.types[0] }' }
                        - with: { type: '${ $context.confirmation_request.types[1] }' }
                  timeout: { after: PT24H }
              - outcome:
                  set: '${ if .[0].type == $context.confirmation_request.types[0] then "confirmed" else "declined" end }'
            catch:
              errors: { with: { status: 408 } }
              do:
                - expired: { set: '${ "expired" }' }
            export: { as: '${ $context + { confirmation_outcome: . } }' }
        - start_worker:
            if: '${ $call.name == "invoke_sub_agent" }'
            call: start_worker
            with: { call: '${ $call }', i: '${ $context.i }', index: '${ $index }', memory: '${ $context.memory }' }
            export: { as: '${ $context + { worker: .run } }' }
        - wait_worker:
            if: '${ $context.worker != null }'
            listen:
              to:
                any:
                  - with: { type: '${ "done:" + $context.worker }' }
                  - with: { type: '${ "waiting:" + $context.worker }' }
            metadata: { hold: PT15M }
        - sleep_worker:
            if: '${ $context.worker != null and .[0].type == ("waiting:" + $context.worker) }'
            listen: { to: { one: { with: { type: '${ "done:" + $context.worker }' } } } }
        - one:
            call: tool
            with:
              loop: '${ $context.loop }'
              call: '${ $call }'
              outcome: '${ $context.confirmation_outcome // null }'
              worker_run: '${ $context.worker // null }'
              # Where the call is (turn, place in the round): a sub-agent's
              # durable run is keyed by it, so a resumed round joins it.
              i: '${ $context.i }'
              index: '${ $index }'
              memory: '${ if ($call.name | startswith("working_memory_")) or $call.name == "invoke_sub_agent" then $context.memory else null end }'
  - settle:
      call: agent_settle
      with: { loop: '${ $context.loop }', calls: '${ $context.calls }', results: '${ . }', memory: '${ $context.memory }' }
      export: { as: '${ $context + { messages: ($context.messages + .replies), memory: .memory } }' }
  - next:
      switch:
        - finished: { when: '${ .finished }', then: end }
        - more: { then: turn }
  - answer:
      set: '${ { output: .content } }'
output:
  as: '${ .output }'
