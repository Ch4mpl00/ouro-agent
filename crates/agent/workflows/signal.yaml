document: { dsl: '1.0.4', namespace: agent, name: signal, version: '1.0.0', metadata: { ouro: { breaker: 'off' } } }
# How one signal is handled, as a durable engine run `signal:<id>` admitted
# with the signal as host data: a button press goes to the guard round that
# waits for it; the saved workflow a scheduled task names; else the most
# specific active route; else the primary agent loop with the context
# gathered for its first turn. Each starts as the signal's primary run, a
# host child the run waits for and settles. A saved workflow that changed
# nothing hands its task over to routing, once. Its catch starts a failure
# report outside this run's tree; reporting never retries the original actions.
# Input: { signal: { id, source, content, env_context, workflow, button, payload, created_at, fallback } },
# `fallback` the line of an override of this workflow set aside for this run.
# Built-ins never trip (design 01, decision 10): a provider outage must not stop the agent.
do:
  - handle:
      try:
        - offer_button:
            if: '${ .signal.button != null }'
            call: deliver_event
            export: { as: '${ $context + { button: . } }' }
        - after_button:
            switch:
              - delivered: { when: '${ .delivered == true }', then: end }
              - ordinary: { then: session }
        - session:
            call: signal_session
            export: { as: '${ $context + . }' }
        - saved:
            if: '${ $context.signal.workflow != null and $context.handover == null }'
            call: run_saved_workflow
            with: { name: '${ $context.signal.workflow }', context: '${ $context }' }
            export: { as: '${ $context + { primary: .started, kind: "saved", handover: .handover } }' }
        - after_saved:
            switch:
              - started: { when: '${ $context.primary != null }', then: wait }
              - on: { then: route }
        - route:
            call: route_signal
            with: { context: '${ $context }' }
            export: { as: '${ $context + { primary: .started, kind: "route", route_fallback: .fallback.line } }' }
        - after_route:
            switch:
              - started: { when: '${ $context.primary != null }', then: wait }
              - default: { then: confirm_target }
        - confirm_target:
            set: >-
                ${ if $context.signal.source == "telegram" or $context.signal.source == "telegram_button"
                   then $context.conversation
                   elif $context.default_chat != null then { chatId: $context.default_chat, messageThreadId: null }
                   else null end }
            export: { as: '${ $context + { confirm: . } }' }
        - input:
            call: signal_input
            export: { as: '${ $context + { input: .input } }' }
        - activity:
            if: '${ $context.signal.source == "telegram" or $context.signal.source == "telegram_button" or $context.signal.source == "peer" }'
            call: recent_activity
            export: { as: '${ $context + { activity: . } }' }
        - pending_confirmations:
            if: '${ $context.confirm != null }'
            call: pending_confirmations
            with: { target: '${ $context.confirm }' }
            export: { as: '${ $context + { pending_confirmations: . } }' }
        - own_skills:
            # A transport source has a skill of its own; domain work is delegated.
            set: '${ if $context.signal.source == "peer" or $context.signal.source == "scheduler" then [ $context.signal.source ] else [] end }'
            export: { as: '${ $context + { own: . } }' }
        - preselect:
            call: preselect_skills
            with:
              request: '${ $context.signal.content }'
              context: '${ "Signal source: " + $context.signal.source + "\n\n" + $context.input }'
              loaded: '${ $context.own + $context.engine_skills }'
            export: { as: '${ $context + { preselected: . } }' }
        - primary:
            call: primary_loop
            with:
              input: '${ $context.input }'
              confirm: '${ $context.confirm }'
              skills: '${ $context.own }'
              loaded: '${ $context.own + $context.engine_skills + ($context.preselected.names // []) }'
              preset: '${ if $context.signal.source == "scheduler" then "base" else "smart" end }'
              allow_skill_writes: '${ $context.signal.source == "dreaming" }'
              system: >-
                ${ [
                  $context.context,
                  $context.activity,
                  $context.pending_confirmations,
                  ("Signal source: " + $context.signal.source),
                  "Call find_skills only when the task needs something specific that the skills already in your instructions don't cover; the source is only a hint. You own delivery.",
                  $context.preselected.block,
                  (if $context.signal.source == "telegram" or $context.signal.source == "telegram_button" then "Delivery: use send_telegram_message for the current signal's chatId and optional messageThreadId. A final assistant message alone is not delivered to Telegram." else null end),
                  $context.signal.env_context,
                  $context.handover,
                  $context.route_fallback,
                  $context.signal.fallback,
                  $context.button.note
                ] | map(select(. != null and . != "")) }
            export: { as: '${ $context + { primary: ., kind: "primary" } }' }
        - wait:
            # No hold: the signal suspends until its primary ends, and the
            # supervisor takes the next signal once the tree is quiescent.
            # The engine reports a child that suspends (`waiting:`) too: it
            # is taken here, then the end is waited for.
            listen:
              read: envelope
              to:
                any:
                  - with: { type: '${ $context.primary.done }' }
                  - with: { type: '${ $context.primary.waiting }' }
        - primary_done:
            if: '${ .[0].type == $context.primary.waiting }'
            listen: { to: { one: { with: { type: '${ $context.primary.done }' } } } }
        - primary_outcome:
            call: child_outcome
            with: { id: '${ $context.primary.id }', key: '${ $context.primary.key }' }
        - settled:
            call: settle_child
            with: { ref: '${ $context.primary }', kind: '${ $context.kind }' }
        - after_settle:
            switch:
              - handover: { when: '${ .action == "handover" }', then: handed_over }
              - raise: { when: '${ .action == "raise" }', then: primary_failed }
              - done: { then: answer }
        - handed_over:
            # A saved workflow that changed nothing gives its task to the
            # routes and the default path; it is tried once per signal.
            set: '${ $context + { handover: .handover, primary: null, kind: null } }'
            export: { as: '${ . }' }
            then: route
        - primary_failed:
            raise:
              error:
                type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
                status: 500
                title: '${ .error.title // "Signal failed" }'
                detail: '${ .error.detail // .error.title // "signal failed" }'
        - answer:
            set: '${ { output: .output } }'
      catch:
        as: failure
        do:
          - transcript:
              call: signal_transcript
              with: { ref: '${ $context.primary // null }' }
              export: { as: '${ $context + { transcript: . } }' }
          - report:
              call: recovery_loop
              with:
                error: '${ $failure }'
                skills: [recovery]
                preset: base
                max_iterations: 5
                system: '${ [ $context.context, $context.signal.env_context ] | map(select(. != null and . != "")) }'
                prompt: >-
                  ${ "Original signal (" + $context.signal.source + "):\n" + $context.signal.content
                    + "\n\nError: " + ($failure.detail // $failure.title // "signal failed")
                    + "\n\nRecent transcript (may be truncated):\n" + $context.transcript
                    + "\n\nReport the failure only. Do not repeat the original actions; some may already have succeeded." }
          - fail:
              # Keep the original detail; the host retains a function's typed error.
              raise:
                error:
                  type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
                  status: 500
                  title: '${ $failure.title // "Signal failed" }'
                  detail: '${ $failure.detail // $failure.title // "signal failed" }'
output:
  as: '${ .output }'
