[package]
name = "evals"
version = "0.1.0"
edition = "2024"

[dependencies]
agent = { path = "../agent" }
owf = { path = "../owf" }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
url = "2.5.8"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3"
